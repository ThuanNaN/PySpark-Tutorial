[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-analytics"
version = "0.1.0"
description = "PySpark Tutorial — NYC Taxi Analytics Pipeline (batch + streaming + ML)"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
